apiVersion: batch/v1
kind: Job
metadata:
  name: url-shortener-topic-init
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener-topic-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: create-topic
          image: redpandadata/redpanda:v24.2.18
          command: ["/bin/sh", "-c"]
          args:
            - >-
              rpk -X brokers=redpanda:9092 topic describe redirect-events
              >/dev/null 2>&1
              || rpk -X brokers=redpanda:9092 topic create redirect-events
              --partitions 12 --replicas 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
