apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - redis.yaml
  - redpanda.yaml
  - topic-init.yaml
  - prometheus.yaml
configMapGenerator:
  - name: url-shortener-postgres-init
    files:
      - init.sql=postgres-init.sql
  - name: url-shortener-prometheus-config
    files:
      - prometheus.yml=prometheus.yml
