apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: url-shortener
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/REPLACE_WITH_ORG/REPLACE_WITH_REPO.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: url-shortener
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/overlays/production
  prune: false
  sourceRef:
    kind: GitRepository
    name: url-shortener
  targetNamespace: url-shortener
  healthChecks:
    - apiVersion: argoproj.io/v1alpha1
      kind: Rollout
      name: url-shortener
      namespace: url-shortener
