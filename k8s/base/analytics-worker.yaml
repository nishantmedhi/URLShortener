apiVersion: v1
kind: Service
metadata:
  name: analytics-worker
spec:
  selector:
    app.kubernetes.io/name: analytics-worker
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-worker
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-worker
          image: urlshortener:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          ports:
            - name: metrics
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: url-shortener-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-worker
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-worker
